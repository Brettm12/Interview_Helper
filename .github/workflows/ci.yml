name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install chromium --with-deps
      # every screen within tolerance of the design reference
      - run: npm run verify:pixels
      # the full scripted mock session, armed through recap (~2 min)
      - run: npm run e2e
      # multi-window plumbing: the strip window must render relayed state
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm run e2e:electron
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pixel-diffs
          path: tools/verify/.out/shots/
